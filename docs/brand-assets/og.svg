<!--
  petdocs Open Graph card — rasterized to public/og.png (1200x630) with:
    rsvg-convert -w 1200 -h 630 docs/brand-assets/og.svg -o public/og.png
  Palette matches src/components/art/PetArt.tsx and globals.css.
  NOTE: background paws use <use fill=...> — keep <g id="paw"> fill-free so
  the fill inherits from the <use> element.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Nunito','Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <g id="paw">
      <ellipse cx="0" cy="9" rx="19" ry="15"/>
      <circle cx="-23" cy="-12" r="9"/>
      <circle cx="-8" cy="-21" r="9"/>
      <circle cx="8" cy="-21" r="9"/>
      <circle cx="23" cy="-12" r="9"/>
    </g>
    <g id="paw-cream" fill="#FFFBF5">
      <ellipse cx="0" cy="9" rx="19" ry="15"/>
      <circle cx="-23" cy="-12" r="9"/>
      <circle cx="-8" cy="-21" r="9"/>
      <circle cx="8" cy="-21" r="9"/>
      <circle cx="23" cy="-12" r="9"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#FFFBF5"/>
  <circle cx="1190" cy="-50" r="250" fill="#F7EFE2"/>
  <circle cx="20" cy="650" r="210" fill="#F7EFE2"/>

  <!-- scattered soft background paws (kept clear of text, chips, card) -->
  <use href="#paw" transform="translate(430 70) scale(0.8)" fill="#F7EFE2"/>
  <use href="#paw" transform="translate(560 592) scale(0.55) rotate(-10)" fill="#F7EFE2"/>
  <use href="#paw" transform="translate(150 580) scale(0.6) rotate(12)" fill="#F7EFE2"/>
  <use href="#paw" transform="translate(1150 596) scale(0.6) rotate(-16)" fill="#F7EFE2"/>

  <!-- header: paw badge + wordmark -->
  <circle cx="106" cy="104" r="54" fill="#F59E0B"/>
  <use href="#paw-cream" transform="translate(106 106) scale(1.05)"/>
  <text x="186" y="126" font-size="66" font-weight="800" fill="#1C1917">petdocs</text>

  <!-- headline -->
  <text x="104" y="296" font-size="68" font-weight="800" fill="#1C1917">Own your pet&#8217;s docs.</text>
  <text x="104" y="382" font-size="68" font-weight="800" fill="#0D9488">Never miss a booster.</text>
  <text x="106" y="442" font-size="27" font-weight="600" fill="#57534E">Vaccines, labs &amp; travel certs in one shareable vault.</text>

  <!-- feature chips -->
  <g font-size="23" font-weight="700" fill="#1C1917">
    <g>
      <rect x="104" y="490" width="252" height="56" rx="28" fill="#FFFFFF" stroke="#1C1917" stroke-opacity="0.1" stroke-width="2"/>
      <circle cx="135" cy="518" r="13" fill="#0D9488"/>
      <path d="M 129 518 l 4.5 4.5 l 8 -9" stroke="#FFFBF5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="158" y="527">Vaccine records</text>
    </g>
    <g>
      <rect x="376" y="490" width="200" height="56" rx="28" fill="#FFFFFF" stroke="#1C1917" stroke-opacity="0.1" stroke-width="2"/>
      <circle cx="407" cy="518" r="13" fill="#0D9488"/>
      <path d="M 401 518 l 4.5 4.5 l 8 -9" stroke="#FFFBF5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="430" y="527">Lab results</text>
    </g>
    <g>
      <rect x="596" y="490" width="216" height="56" rx="28" fill="#FFFFFF" stroke="#1C1917" stroke-opacity="0.1" stroke-width="2"/>
      <circle cx="627" cy="518" r="13" fill="#0D9488"/>
      <path d="M 621 518 l 4.5 4.5 l 8 -9" stroke="#FFFBF5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="650" y="527">Travel certs</text>
    </g>
  </g>

  <!-- document card illustration (right column, x &#8805; 860) -->
  <g transform="rotate(7 1010 300)">
    <rect x="900" y="140" width="250" height="320" rx="22" fill="#FCD34D"/>
  </g>
  <g transform="rotate(-4 1000 348)">
    <rect x="872" y="176" width="256" height="344" rx="24" fill="#FFFFFF" stroke="#1C1917" stroke-width="3"/>
    <path d="M 872 200 a 24 24 0 0 1 24 -24 h 208 a 24 24 0 0 1 24 24 v 52 h -256 z" fill="#0D9488"/>
    <text x="1000" y="230" font-size="24" font-weight="800" letter-spacing="3" fill="#FFFBF5" text-anchor="middle">PET PASSPORT</text>
    <!-- paw stamp -->
    <circle cx="1000" cy="300" r="48" fill="#FCD34D"/>
    <use href="#paw" transform="translate(1000 300) scale(0.9)" fill="#0F766E"/>
    <!-- record lines -->
    <rect x="904" y="376" width="192" height="13" rx="6.5" fill="#F7EFE2"/>
    <rect x="904" y="402" width="152" height="13" rx="6.5" fill="#F7EFE2"/>
    <!-- verified row -->
    <circle cx="916" cy="452" r="12" fill="#0D9488"/>
    <path d="M 910.5 452 l 4 4 l 7.5 -8" stroke="#FFFBF5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="938" y="460" font-size="20" font-weight="700" fill="#1C1917">Rabies &#183; current</text>
  </g>
</svg>
