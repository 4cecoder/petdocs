name: Android CI (debug APK)

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Test + assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Unit tests include the Robolectric Compose UI tests for the sign-in
      # flow and MockWebServer tests for the API layer — no emulator needed.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # No signing, no Firebase secrets: MVP has no google-services.json,
      # so this builds an unsigned debug APK only. Version metadata is
      # stamped from CI (see android/app/build.gradle.kts).
      - name: Assemble debug APK
        run: >-
          ./gradlew assembleDebug --stacktrace
          -PappVersionCode=${{ github.run_number }}
          -PappVersionName=0.1.0-beta

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: petdocs-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
