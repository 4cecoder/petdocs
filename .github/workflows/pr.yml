name: PR checks (web)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint / Typecheck / Unit / Build / Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The role matrix runs against localhost under `next start`, which is
      # production-mode. Keep the shortcut localhost-only while explicitly
      # enabling it for this mock-only CI build; deployed production builds
      # never set this flag.
      NEXT_PUBLIC_E2E_LOCAL_DEMO: "1"
      # Keep Convex calls same-origin so Playwright can intercept them. This
      # is a mock-only CI build and never points at a deployment.
      NEXT_PUBLIC_CONVEX_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # NOTE: repo has no bun.lock yet — run `bun install` locally and commit
      # the lockfile; until then --frozen-lockfile fails on a fresh clone.
      # Bun-only repo: never commit package-lock.json (see AGENTS.md).
      - name: Install deps (bun)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Build (Next.js)
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      - name: Playwright smoke
        run: bun run test:e2e:smoke
        env:
          CI: true
